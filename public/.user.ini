; رفع محدودیت آپلود در هاست اشتراکی (CGI/FastCGI)
; اگر PHP به صورت CGI/FPM اجرا شود این مقادیر اعمال می‌شوند.
; (برای آپلود تکه‌ای ZIP نسخه/پشتیبان تا ~۵۱۲ مگابایت)
upload_max_filesize = 600M
post_max_size = 620M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
max_file_uploads = 30

; فعال‌سازی دریافت فایل از URL برای WSDL درگاه‌ها (در صورت محدودیت allow_url_fopen)
allow_url_fopen = On
