; رفع محدودیت آپلود در هاست اشتراکی (CGI/FastCGI)
; اگر PHP به صورت CGI/FPM اجرا شود این مقادیر اعمال می‌شوند.
; (برای فایل‌های ZIP نسخه پکیج تا ~۳۰۰ مگابایت)
upload_max_filesize = 320M
post_max_size = 330M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; فعال‌سازی دریافت فایل از URL برای WSDL درگاه‌ها (در صورت محدودیت allow_url_fopen)
allow_url_fopen = On
